<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>悬账单 · 对拍</title>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>
  <div class="壳">
    <header class="顶栏">
      <div class="顶左">
        <div class="牌名">对拍</div>
        <div class="牌骨">左轨装载 → 右轨装载 → 同键对齐落差 → 单边悬账 → 对拍结论</div>
      </div>
      <nav class="管线">
          <a href="/">对拍台</a>
          <a href="/左轨.html">左轨流水</a>
          <a href="/右轨.html">右轨流水</a>
          <a href="/对齐差.html">对齐差表</a>
          <a href="/日界.html">日界切开禁跨</a>
          <a href="/悬账单.html" class="亮">悬账单</a>
          <a href="/对拍结论.html">对拍结论</a>
          <a href="/源登记.html">源登记</a>
          <a href="/轨规.html">轨规</a>
      </nav>
    </header>
    <main class="主">

      <section class="行卡">
        <h1>悬账单</h1>
        <p class="说明">对齐后仅单边有键（或需人工处理）的业务键。日界禁跨形态下，跨日悬账由下方「日界旁路凭证」钉住，结论读旁路集。</p>
        <div class="工具条"><button class="次" id="刷">刷新</button></div>
      </section>
      <section class="行卡">
        <h2>日界旁路凭证（禁跨钉跨日，无双边对齐差）</h2>
        <div id="旁路"></div>
      </section>
      <section class="行卡"><div id="表"></div></section>

    </main>
  </div>
  <script src="/common.js"></script>
  <script>
(async () => {
  const paint = async () => {
    const [rows, 日界] = await Promise.all([get("/api/悬账单"), get("/api/日界")]);
    const 凭证 = 日界.filter(r => r.差或旁路 === "禁跨旁路");
    document.getElementById("旁路").innerHTML = 表(
      ["凭证号","业务键","悬边","左日","右日","左金额分","右金额分","valid","说明"],
      凭证,
      r => `<td>${r.凭证号}</td><td>${r.业务键}</td><td>${徽(r.悬边 ?? "")}</td>
        <td>${r.左日 || "-"}</td><td>${r.右日 || "-"}</td>
        <td>${r.左金额分 ?? "-"}</td><td>${r.右金额分 ?? "-"}</td>
        <td>${徽(r.valid ? "1" : "0")}</td><td>${r.说明}</td>`
    );
    document.getElementById("表").innerHTML = 表(
      ["编号","业务键","悬边","金额分","事件编号","原因","时刻"],
      rows,
      r => `<td>${r.编号}</td><td>${r.业务键}</td><td>${徽(r.悬边)}</td><td>${r.金额分}</td>
        <td>${r.事件编号||"-"}</td><td>${r.原因.includes("日界") ? 徽("日界") + r.原因 : r.原因}</td><td>${r.时刻}</td>`
    );
  };
  await paint();
  document.getElementById("刷").onclick = paint;
})();
</script>
</body>
</html>
