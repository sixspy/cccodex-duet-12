<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>日界切开禁跨 · 对拍</title>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>
  <div class="壳">
    <header class="顶栏">
      <div class="顶左">
        <div class="牌名">对拍</div>
        <div class="牌骨">左轨装载 → 右轨装载 → 同键对齐落差 → 单边悬账 → 对拍结论</div>
      </div>
      <nav class="管线">
          <a href="/">对拍台</a>
          <a href="/左轨.html">左轨流水</a>
          <a href="/右轨.html">右轨流水</a>
          <a href="/对齐差.html">对齐差表</a>
          <a href="/日界.html" class="亮">日界切开禁跨</a>
          <a href="/悬账单.html">悬账单</a>
          <a href="/对拍结论.html">对拍结论</a>
          <a href="/源登记.html">源登记</a>
          <a href="/轨规.html">轨规</a>
      </nav>
    </header>
    <main class="主">

      <section class="行卡">
        <h1>日界切开禁跨</h1>
        <p class="说明">
          流水按「业务键 + 业务日（事件时 UTC 日期）」归组后再对齐。同日双边落对齐差；
          跨日同键二择一：<b>禁跨</b>不写双边对齐差、两侧写旁路凭证钉跨日（结论读旁路集）；
          <b>打标</b>仍写对齐差并标跨日（不写旁路）。切日与基线对齐共用一锁，并发不双落。
        </p>
        <div class="工具条">
          <label>跨日策略
            <select id="策略">
              <option value="禁跨">禁跨（切日，旁路凭证）</option>
              <option value="打标">打标（跨日对齐差）</option>
            </select>
          </label>
          <button id="存策略">存策略</button>
          <button id="跑">跑日界对齐</button>
          <button class="次" id="刷">刷新</button>
        </div>
        <pre class="报" id="报"></pre>
      </section>
      <section class="行卡"><div id="表"></div></section>

    </main>
  </div>
  <script src="/common.js"></script>
  <script>
(async () => {
  const paint = async () => {
    const rows = await get("/api/日界");
    document.getElementById("表").innerHTML = 表(
      ["业务键","左日","右日","差或旁路","跨日","左金额分","右金额分","凭证号","valid","说明","时刻"],
      rows,
      r => `<td>${r.业务键}</td><td>${r.左日 || "-"}</td><td>${r.右日 || "-"}</td>
        <td>${徽(r.差或旁路)}</td><td>${r.跨日 ? 徽("跨日") : "-"}</td>
        <td>${r.左金额分 ?? "-"}</td><td>${r.右金额分 ?? "-"}</td>
        <td>${r.凭证号 || "-"}</td><td>${徽(r.valid ? "1" : "0")}</td>
        <td>${r.说明}</td><td>${r.时刻}</td>`
    );
  };
  const s = await get("/api/日界策略");
  document.getElementById("策略").value = s.策略;
  await paint();
  document.getElementById("存策略").onclick = async () => {
    document.getElementById("报").textContent = JSON.stringify(
      await post("/api/日界策略", { 策略: document.getElementById("策略").value }), null, 2);
  };
  document.getElementById("跑").onclick = async () => {
    try {
      document.getElementById("报").textContent = JSON.stringify(await post("/api/日界/跑"), null, 2);
    } catch (e) {
      document.getElementById("报").textContent = "409 锁冲突：" + e.message;
    }
    await paint();
  };
  document.getElementById("刷").onclick = paint;
})();
  </script>
</body>
</html>
